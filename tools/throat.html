<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throat</title>
<style>
:root{
  --platinum:#dcdce0; --platinum-hi:#ececef; --etch:#9c9ca4; --ink:#000; --ink-soft:#4a4a52; --inset:#f4f4f6; --desk:#b9b9c0;
  --red:#e03a3e; --red-dk:#9e1f23; --blue:#009ddc; --blue-dk:#00699a; --graphite:#6e6e78; --screen:#0b0b0e; --lcd:#8f8;
  --ui:"Lucida Grande","Lucida Sans Unicode",Geneva,Verdana,sans-serif; --mono:Monaco,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 1px 1px, rgba(0,0,0,.09) 1px, transparent 1.5px) 0 0/6px 6px, var(--desk);
  font:13px/1.45 var(--ui); color:var(--ink); padding:24px 16px 40px; -webkit-user-select:none; user-select:none}
.window{max-width:900px;margin:0 auto;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, rgba(255,255,255,0) 1px 2px, rgba(0,0,0,.035) 2px 3px, rgba(0,0,0,0) 3px 4px), var(--platinum);
  border:1px solid #7d7d86;border-radius:9px;box-shadow:0 1px 0 #fff inset, 0 12px 32px rgba(0,0,0,.22);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:12px;padding:9px 14px 8px;background:linear-gradient(#f6f6f8,#d6d6db);border-bottom:1px solid #8e8e96}
.mark{width:22px;height:18px;border-radius:3px;background:var(--graphite);box-shadow:0 0 0 1px rgba(0,0,0,.35);position:relative;flex:none;overflow:hidden}
.mark::after{content:"";position:absolute;left:0;right:0;top:7px;height:4px;background:var(--red)}
.titlebar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.titlebar .sub{color:var(--ink-soft);font-size:11px}
.titlebar .sub .ver{margin-left:6px;color:#7a7a84}
.body{padding:14px 18px 16px}

/* screen */
.screen{background:var(--screen);border-radius:6px;padding:10px;box-shadow:0 0 0 1px #000,0 2px 6px rgba(0,0,0,.5) inset;position:relative}
.views{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.view{position:relative}
.view canvas{display:block;width:100%;height:150px;border-radius:3px;background:#060608}
.view .lbl{position:absolute;left:8px;top:6px;font:10px/1 var(--mono);color:var(--lcd);opacity:.8;letter-spacing:1px;pointer-events:none}
.readouts{display:flex;flex-wrap:wrap;gap:4px 18px;font:11px/1 var(--mono);color:var(--lcd);margin-top:8px;letter-spacing:1px}
.readouts b{font-weight:400;opacity:.6;margin-right:6px}
.power{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,11,14,.86);border-radius:6px;z-index:2}
.power.hide{display:none}

/* controls */
.rows{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
fieldset{flex:1 1 auto;margin:0;border:1px solid var(--etch);border-radius:6px;padding:8px 12px 10px;background:rgba(236,236,239,.7);box-shadow:0 1px 0 #fff, inset 0 1px 0 #fff;min-width:0}
legend{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:0 6px;display:flex;align-items:center;gap:6px}
legend .dot{width:8px;height:8px;border-radius:50%;background:var(--graphite);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.knobs{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end;justify-content:space-around}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;width:60px}
.knob.big{width:84px}
#g-out{flex-direction:column;align-items:center;gap:8px}
#g-out .segwrap{padding-bottom:0}
.dial{--v:0;--a0:0deg;--a1:0deg;--c:var(--graphite);position:relative;width:44px;height:44px;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;
  background:conic-gradient(from 225deg, #b9b9c0 0 var(--a0), var(--c) var(--a0) var(--a1), #b9b9c0 var(--a1) 270deg, transparent 270deg)}
.knob.big .dial{width:66px;height:66px}
.dial::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--platinum-hi)}
.dial .cap{position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.95) 0 18%, rgba(255,255,255,0) 46%), radial-gradient(circle at 50% 80%, #f7f7fa, #c8c8ce 60%, #9a9aa3);
  box-shadow:0 2px 3px rgba(0,0,0,.35), 0 0 0 1px #7d7d86}
.knob.big .dial .cap{inset:8px}
.dial .ptr{position:absolute;inset:6px;border-radius:50%;pointer-events:none}
.knob.big .dial .ptr{inset:8px}
.dial .ptr::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:30%;margin-left:-1.5px;border-radius:2px;background:#1a1a1e}
.dial:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.knob .name{font-weight:700;white-space:nowrap}
.val{font:700 10.5px var(--ui);background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);border-radius:3px;padding:1px 6px;min-width:52px;text-align:center;white-space:nowrap}

.seg{display:inline-flex;border:1px solid #7d7d86;border-radius:999px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg button{font:700 11px var(--ui);border:0;padding:4px 12px;cursor:pointer;color:#222;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.seg button+button{border-left:1px solid #9c9ca4}
.seg button[aria-pressed="true"]{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.3);background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea)}
.segwrap{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;padding-bottom:4px}

.gel{display:inline-flex;align-items:center;padding:6px 18px;border-radius:999px;font:700 12px var(--ui);color:#fff;border:1px solid var(--blue-dk);position:relative;cursor:pointer;
  background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea);box-shadow:0 2px 4px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.5) inset;text-shadow:0 -1px 0 rgba(0,0,0,.3)}
.gel::before{content:"";position:absolute;left:10px;right:10px;top:2px;height:45%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.1));pointer-events:none}
.gel.grey{color:#222;border-color:#7d7d86;text-shadow:0 1px 0 #fff;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.gel.red{border-color:var(--red-dk);background:linear-gradient(#f7a4a6,var(--red) 48%,#c42a2e 52%,#ee6a6d)}

/* test filters */
.aids{margin-top:12px;border-style:dashed;background:rgba(244,244,246,.55)}
.aids legend{color:var(--ink-soft)}
.aidrow{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.aid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:7px;font-weight:700;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border-radius:4px;border:1px solid #7d7d86;cursor:pointer;
  background:linear-gradient(#fff,#d8d8dd);box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative}
.check input:checked{border-color:var(--blue-dk);background:linear-gradient(#8fd8f7,var(--blue) 48%,#0086c0 52%,#38b8ea)}
.check input:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check input:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.slide{display:flex;align-items:center;gap:8px;font-weight:700}
.slide input[type=range]{-webkit-appearance:none;appearance:none;width:200px;height:6px;border-radius:3px;background:linear-gradient(#a9a9b0,#d4d4d9);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);outline:none}
.slide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:14px;border-radius:7px;border:1px solid #7d7d86;cursor:ew-resize;
  background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.slide input[type=range]::-moz-range-thumb{width:22px;height:14px;border-radius:7px;border:1px solid #7d7d86;cursor:ew-resize;background:linear-gradient(#fff,#d8d8dd 48%,#c4c4ca 52%,#e6e6ea)}
.slide input:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.dim{opacity:.45}

/* keyboard */
.kbd{margin-top:14px;position:relative;height:118px;border-radius:6px;background:linear-gradient(#3a3a40,#1d1d22);padding:8px 8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 4px rgba(0,0,0,.3)}
.keys{position:relative;height:100%}
.key{position:absolute;top:0;bottom:0;border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--mono);cursor:pointer;touch-action:none}
.key.w{background:linear-gradient(#fff,#e6e6ea);border:1px solid #6e6e78;color:#6e6e78;z-index:1}
.key.b{background:linear-gradient(#3b3b42,#111);height:62%;bottom:auto;color:#bbb;z-index:2;border:1px solid #000;font-size:10px;padding-bottom:4px}
.key.on.w{background:linear-gradient(#ffd3d4,var(--red));color:#fff}
.key.on.b{background:linear-gradient(#ff8b8e,var(--red-dk));color:#fff}
.key .c{position:absolute;top:6px;font:9px var(--ui);color:#9c9ca4;font-weight:400}

.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:12px;font-size:11px;color:var(--ink-soft)}
.foot .sp{margin-left:auto}
.err{display:none;margin-top:10px;padding:8px 10px;border-left:4px solid var(--red);background:#fdeced;font-size:12px}
@media (max-width:720px){ .views{grid-template-columns:1fr} .head .ver{margin-left:0} .slide input[type=range]{width:140px} }
@media (prefers-reduced-motion: reduce){ .key{transition:none} }
</style>
</head>
<body>
<div class="window" role="application" aria-label="Throat test bench">
  <div class="titlebar">
    <span class="mark" aria-hidden="true"></span>
    <h1>Throat</h1>
    <span class="sub">Bytebent Audio<span class="ver">bench</span></span>
  </div>
  <div class="body">
    <div class="screen">
      <div class="views">
        <div class="view"><canvas id="glot" aria-label="Last two glottal cycles"></canvas><span class="lbl" id="glotLbl">GLOTTAL FLOW</span></div>
        <div class="view"><canvas id="spec" aria-label="Output spectrum"></canvas><span class="lbl">SPECTRUM</span></div>
      </div>
      <div class="readouts" aria-live="off">
        <span><b>F0</b><span id="roF0">—</span></span>
        <span><b>RD</b><span id="roRd">—</span></span>
        <span><b>OQ</b><span id="roOq">—</span></span>
        <span><b>VOICES</b><span id="roVo">0</span></span>
        <span><b>OCT</b><span id="roOct">C2</span></span>
        <span><b>VEL</b><span id="roVel">100</span></span>
      </div>
      <div class="power" id="power">
        <button class="gel red" id="powerBtn" type="button">Power on</button>
      </div>
    </div>

    <div class="rows">
      <fieldset><legend><span class="dot" style="background:var(--red)"></span>Phonation</legend><div class="knobs" id="g-phon"></div></fieldset>
      <fieldset><legend><span class="dot"></span>Irregularity</legend><div class="knobs" id="g-irr"></div></fieldset>
      <fieldset><legend><span class="dot"></span>Pitch</legend><div class="knobs" id="g-pitch">
        <div class="segwrap">Voices<div class="seg" id="segMode"><button type="button" data-v="0">Mono</button><button type="button" data-v="1">Poly</button></div></div>
      </div></fieldset>
      <fieldset><legend><span class="dot"></span>Envelope</legend><div class="knobs" id="g-env"></div></fieldset>
      <fieldset><legend><span class="dot"></span>Output</legend><div class="knobs" id="g-out">
        <div class="segwrap">Source<div class="seg" id="segSrc"><button type="button" data-v="0">Flow</button><button type="button" data-v="1">Derivative</button></div></div>
      </div></fieldset>
    </div>

    <fieldset class="aids">
      <legend><span class="dot" style="background:#fff;box-shadow:0 0 0 1px #6e6e78 inset"></span>Test filters</legend>
      <div class="aidrow">
        <div class="aid">
          <label class="check"><input type="checkbox" id="vowelOn"> Vowel</label>
          <span class="slide" id="vowelWrap"><span>A</span><input type="range" id="vowel" min="0" max="1" step="0.001" value="0" aria-label="Vowel, A to I"><span>I</span></span>
        </div>
        <div class="aid">
          <label class="check"><input type="checkbox" id="lpOn"> Low-pass</label>
          <div class="knobs" id="g-lp"></div>
        </div>
      </div>
    </fieldset>

    <div class="kbd"><div class="keys" id="keys"></div></div>
    <div class="foot">
      <button class="gel grey sp" id="panic" type="button">All notes off</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<script type="text/plain" id="dsp">
/*
 * Throat engine v0.1 · bytebent
 *
 * A parametric larynx. It makes every sound in the Throat/Mouth pair:
 *   - glottal pulses from the LF (Liljencrants–Fant) model, shaped by Rd
 *     (pressed ← 0.3 … 1.0 modal … 2.7 → breathy), output as flow or flow derivative,
 *   - breath / turbulence noise, steady and pulsed by each glottal opening,
 *   - per-cycle irregularity (jitter, shimmer, creak) and subharmonics (growl).
 *
 * Pulses and noise run at 4x the host rate and are decimated with a windowed-sinc
 * FIR, so sharp (tense, high) pulses don't alias. process() never allocates.
 *
 * Works in an AudioWorklet and in Node (module.exports) for offline tests.
 */
(function (root) {
  'use strict';

  const OS = 4;                       // internal oversampling
  const TN = 2048;                    // table points per glottal period
  const TW = TN + 1;                  // stored row width (wrap point)
  const MIP_LEVELS = 9;               // harmonic limits 1024, 512, … 4 (band-limited copies)
  const RD_LO = 0.3, RD_HI = 2.7, RD_STEP = 0.05;
  const RD_COUNT = Math.round((RD_HI - RD_LO) / RD_STEP) + 1;   // 49
  const RD_MODAL = 1.0;
  const RD_SUB = 0.45;                // false-fold (growl) pulse shape
  const TABLE_RMS = 0.1;              // pulse level at modal voice
  const NORM_POW = 0.7;               // how much loudness is evened out across Rd
  const FIR_LEN = 128;                // decimation filter taps (at 4x rate)
  const BLOCK = 32;                   // fixed internal control block (host samples) = latency
  const MAX_VOICES = 8;

  /* ---------- LF model ---------- */

  // Solve the LF model for one Rd value. Period T0 = 1, excitation Ee = 1.
  function lfSolve(Rd) {
    const Ra = (-1 + 4.8 * Rd) / 100;
    const Rk = (22.4 + 11.8 * Rd) / 100;
    const Rg = 0.25 * Rk / (0.11 * Rd / (0.5 + 1.2 * Rk) - Ra);
    const Tp = 1 / (2 * Rg), Te = Tp * (1 + Rk), Ta = Ra;
    const d = 1 - Te;
    let eps = 1 / Ta;
    for (let i = 0; i < 300; i++) eps = (1 - Math.exp(-eps * d)) / Ta;
    const wg = Math.PI / Tp, sinTe = Math.sin(wg * Te), cosTe = Math.cos(wg * Te);
    const ed = Math.exp(-eps * d);
    const retArea = -((1 - ed) / eps - d * ed) / (eps * Ta);
    const openArea = a => (a * sinTe - wg * cosTe + wg * Math.exp(-a * Te)) * (-1 / sinTe) / (a * a + wg * wg);
    // total area must be zero (flow returns to its starting value); f(a) decreases with a
    let lo = -200, hi = 200;
    for (let i = 0; i < 200; i++) {
      const mid = 0.5 * (lo + hi);
      if (openArea(mid) + retArea > 0) lo = mid; else hi = mid;
    }
    const a = 0.5 * (lo + hi);
    return { Rd, Tp, Te, Ta, eps, a, wg, sinTe, ed, flowTe: openArea(a), area: openArea(a) + retArea };
  }

  // Flow and flow derivative at normalised time t in [0, 1].
  function lfEval(p, t, out) {
    if (t <= p.Te) {
      const e = Math.exp(p.a * (t - p.Te));
      const s = Math.sin(p.wg * t), c = Math.cos(p.wg * t);
      out[1] = -e * s / p.sinTe;
      out[0] = (e * (p.a * s - p.wg * c) + p.wg * Math.exp(-p.a * p.Te)) * (-1 / p.sinTe) / (p.a * p.a + p.wg * p.wg);
    } else {
      const u = t - p.Te, eu = Math.exp(-p.eps * u);
      out[1] = -(eu - p.ed) / (p.eps * p.Ta);
      out[0] = p.flowTe - ((1 - eu) / p.eps - u * p.ed) / (p.eps * p.Ta);
    }
  }

  /* ---------- tables (built once) ---------- */

  let TABLES = null;

  function rmsOf(arr, off, n, removeMean) {
    let m = 0;
    if (removeMean) { for (let i = 0; i < n; i++) m += arr[off + i]; m /= n; }
    let s = 0;
    for (let i = 0; i < n; i++) { const v = arr[off + i] - m; s += v * v; }
    return Math.sqrt(s / n);
  }

  function buildTables() {
    if (TABLES) return TABLES;
    const flowRaw = new Float64Array(RD_COUNT * TW);
    const derivRaw = new Float64Array(RD_COUNT * TW);
    const flow = new Float32Array(RD_COUNT * TW);
    const deriv = new Float32Array(RD_COUNT * TW);
    const shape = new Float32Array(RD_COUNT * TW);     // flow scaled to peak 1 (drives pulsed breath)
    const te = new Float32Array(RD_COUNT);              // open quotient per row
    const tmp = [0, 0];
    for (let r = 0; r < RD_COUNT; r++) {
      const p = lfSolve(RD_LO + r * RD_STEP);
      te[r] = p.Te;
      const o = r * TW;
      for (let i = 0; i < TN; i++) {
        lfEval(p, i / TN, tmp);
        flowRaw[o + i] = tmp[0];
        derivRaw[o + i] = tmp[1];
      }
      // tiny numerical residue: pin the period end to the start
      const endFlow = (lfEval(p, 1, tmp), tmp[0]);
      for (let i = 0; i < TN; i++) flowRaw[o + i] -= endFlow * (i / TN);
      flowRaw[o + TN] = flowRaw[o];
      derivRaw[o + TN] = derivRaw[o];
    }
    const ref = Math.round((RD_MODAL - RD_LO) / RD_STEP);
    const refF = rmsOf(flowRaw, ref * TW, TN, true), refD = rmsOf(derivRaw, ref * TW, TN, false);
    const flowMip = [], derivMip = [];
    for (let l = 0; l < MIP_LEVELS; l++) { flowMip.push(new Float32Array(RD_COUNT * TW)); derivMip.push(new Float32Array(RD_COUNT * TW)); }
    const re = new Float64Array(TN), im = new Float64Array(TN), sre = new Float64Array(TN), sim = new Float64Array(TN);
    for (let r = 0; r < RD_COUNT; r++) {
      const o = r * TW;
      const rf = rmsOf(flowRaw, o, TN, true), rd = rmsOf(derivRaw, o, TN, false);
      const gf = (TABLE_RMS / refF) * Math.pow(refF / rf, NORM_POW);
      const gd = (TABLE_RMS / refD) * Math.pow(refD / rd, NORM_POW);
      let peak = 0;
      for (let i = 0; i < TW; i++) peak = Math.max(peak, flowRaw[o + i]);
      for (let i = 0; i < TW; i++) {
        flow[o + i] = flowRaw[o + i] * gf;
        deriv[o + i] = derivRaw[o + i] * gd;
        shape[o + i] = Math.max(0, flowRaw[o + i] / peak);
      }
      // band-limited copies: keep harmonics 1..H, H = 1024 >> level
      for (let kind = 0; kind < 2; kind++) {
        const src = kind ? deriv : flow, dst = kind ? derivMip : flowMip;
        for (let i = 0; i < TN; i++) { sre[i] = src[o + i]; sim[i] = 0; }
        fft(sre, sim, false);
        for (let l = 0; l < MIP_LEVELS; l++) {
          const H = (TN / 2) >> l;
          for (let i = 0; i < TN; i++) { re[i] = 0; im[i] = 0; }
          re[0] = sre[0];
          for (let k = 1; k <= H && k < TN / 2; k++) {
            re[k] = sre[k]; im[k] = sim[k]; re[TN - k] = sre[TN - k]; im[TN - k] = sim[TN - k];
          }
          if (H >= TN / 2) { re[TN / 2] = sre[TN / 2]; }
          fft(re, im, true);
          const d = dst[l];
          for (let i = 0; i < TN; i++) d[o + i] = re[i] / TN;
          d[o + TN] = d[o];
        }
      }
    }
    // Thin: an almost-sine pulse (raised cosine flow over the whole period)
    const sFlow = new Float32Array(TW), sDeriv = new Float32Array(TW), sShape = new Float32Array(TW);
    for (let i = 0; i < TW; i++) {
      const t = i / TN;
      sShape[i] = 0.5 * (1 - Math.cos(2 * Math.PI * t));
      sFlow[i] = sShape[i];
      sDeriv[i] = Math.PI * Math.sin(2 * Math.PI * t);
    }
    const thinLevel = 0.8 * TABLE_RMS;
    const g1 = thinLevel / rmsOf(sFlow, 0, TN, true), g2 = thinLevel / rmsOf(sDeriv, 0, TN, false);
    for (let i = 0; i < TW; i++) { sFlow[i] *= g1; sDeriv[i] *= g2; }
    TABLES = { flow, deriv, shape, te, sFlow, sDeriv, sShape, flowMip, derivMip };
    return TABLES;
  }

  // in-place radix-2 FFT (table building only)
  function fft(re, im, inverse) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let len = 2; len <= n; len <<= 1) {

  let viz = null, vizAt = 0, scale = 0.2, voices = 0;
  const ro = { f0: document.getElementById('roF0'), rd: document.getElementById('roRd'), oq: document.getElementById('roOq'), vo: document.getElementById('roVo') };
  function onMsg(e) {
    const m = e.data;
    if (m.t === 'viz') {
      viz = m; vizAt = performance.now(); voices = m.voices;
      ro.f0.textContent = m.f0 ? m.f0.toFixed(1) + ' Hz' : '—';
      ro.rd.textContent = m.rd.toFixed(2);
      ro.oq.textContent = m.oq.toFixed(2);
    } else if (m.t === 'stat') voices = m.voices;
    ro.vo.textContent = voices + (state.mode === 1 ? '/8' : '');
  }
  function fit(c) {
    const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    const w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    return d;
  }
  function drawGlot() {
    const d = fit(glot), W = glot.width, H = glot.height, mid = H * 0.55;
    gx.clearRect(0, 0, W, H);
    gx.strokeStyle = 'rgba(143,255,136,.08)'; gx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { gx.beginPath(); gx.moveTo(0, H * i / 4); gx.lineTo(W, H * i / 4); gx.stroke(); }
    gx.beginPath(); gx.moveTo(W / 2, 0); gx.lineTo(W / 2, H); gx.stroke();
    document.getElementById('glotLbl').textContent = state.source ? 'FLOW DERIVATIVE' : 'GLOTTAL FLOW';
    const fresh = viz && performance.now() - vizAt < 400 && voices > 0;
    if (!fresh) {
      gx.strokeStyle = 'rgba(224,58,62,.35)'; gx.lineWidth = 2 * d; gx.beginPath(); gx.moveTo(0, mid); gx.lineTo(W, mid); gx.stroke();
      return;
    }
    const g = viz.g, n = viz.n, N = g.length;
    let mx = 0; for (let i = 0; i < N; i++) mx = Math.max(mx, Math.abs(g[i]), n[i] * 0.35);
    scale += ((mx > 1e-4 ? mx : scale) - scale) * (mx > scale ? 0.5 : 0.06);
    const ys = H * 0.4 / Math.max(scale, 1e-3);
    const X = i => i / (N - 1) * W;
    // breath: a band riding on the glottal signal
    gx.fillStyle = 'rgba(224,58,62,.22)';
    gx.beginPath();
    for (let i = 0; i < N; i++) gx.lineTo(X(i), mid - (g[i] + n[i] * 0.35) * ys);
    for (let i = N - 1; i >= 0; i--) gx.lineTo(X(i), mid - (g[i] - n[i] * 0.35) * ys);
    gx.closePath(); gx.fill();
    gx.strokeStyle = '#e03a3e'; gx.lineWidth = 2 * d; gx.shadowColor = '#e03a3e'; gx.shadowBlur = 8 * d;
    gx.beginPath();
    for (let i = 0; i < N; i++) { const y = mid - g[i] * ys; i ? gx.lineTo(X(i), y) : gx.moveTo(X(i), y); }
    gx.stroke(); gx.shadowBlur = 0;
  }
  let fbuf = null;
  function drawSpec() {
    const d = fit(spec), W = spec.width, H = spec.height;
    sx.clearRect(0, 0, W, H);
    const fmin = 50, fmax = 16000, lx = f => Math.log(f / fmin) / Math.log(fmax / fmin) * W;
    sx.strokeStyle = 'rgba(143,255,136,.08)'; sx.lineWidth = 1; sx.fillStyle = 'rgba(143,255,136,.45)'; sx.font = (9 * d) + 'px Monaco, monospace'; sx.textAlign = 'center';
    for (const f of [100, 200, 500, 1000, 2000, 5000, 10000]) {
      const x = lx(f); sx.beginPath(); sx.moveTo(x, 0); sx.lineTo(x, H); sx.stroke();
      if (f === 100 || f === 1000 || f === 10000) sx.fillText(f >= 1000 ? (f / 1000) + 'k' : f, x, H - 4 * d);
    }
    if (!analyser) return;
    if (!fbuf) fbuf = new Float32Array(analyser.frequencyBinCount);
    analyser.getFloatFrequencyData(fbuf);
    const binHz = ctx.sampleRate / analyser.fftSize, lo = analyser.minDecibels, hi = analyser.maxDecibels;
    const y = v => H - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (H - 14 * d) - 12 * d;
    sx.beginPath(); sx.moveTo(0, H);
    let px = -1;
    for (let x = 0; x <= W; x += d) {
      const f0 = fmin * Math.pow(fmax / fmin, x / W), f1 = fmin * Math.pow(fmax / fmin, (x + d) / W);
      let b0 = Math.floor(f0 / binHz), b1 = Math.max(b0 + 1, Math.ceil(f1 / binHz)), m = -200;
      for (let b = b0; b < b1 && b < fbuf.length; b++) m = Math.max(m, fbuf[b]);
      sx.lineTo(x, y(m)); px = x;
    }
    sx.lineTo(px, H); sx.closePath();
    const grd = sx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, 'rgba(224,58,62,.55)'); grd.addColorStop(1, 'rgba(224,58,62,.05)');
    sx.fillStyle = grd; sx.fill();
    sx.strokeStyle = '#e03a3e'; sx.lineWidth = 1.2 * d; sx.stroke();
  }
  const slow = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = 0;
  function frame(t) {
    if (!slow || t - last > 250) { last = t; drawGlot(); drawSpec(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
